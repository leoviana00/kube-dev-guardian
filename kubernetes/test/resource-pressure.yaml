apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-pressure
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-pressure
  template:
    metadata:
      labels:
        app: resource-pressure
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi