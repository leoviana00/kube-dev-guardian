grafana:
  enabled: true

  adminPassword: admin

  persistence:
    enabled: false

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi

      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

      limits:
        cpu: 250m
        memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true